services:
  portofolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/portofolio:latest
    container_name: portofolio
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./:/app:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    user: "65534:65534"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
