<!DOCTYPE html>
<html lang="en" style="background-color: #0f0f0f; color: #e0e0e0;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMV Project</title>
  <link rel="icon" type="image/png" href="/static/mmvlogo.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="/" class="nav-item" data-i18n="nav_intro">Introduction</a>
      <a href="/demo" class="nav-item" data-i18n="nav_demo">Demo</a>
      <a href="/contact" class="nav-item" data-i18n="nav_contact">Contact</a>
    </div>
    <div class="nav-right">
      <div class="dropdown">
        <button class="dropbtn" data-i18n="nav_language">Language ▼</button>
        <div class="dropdown-content">
          <a href="#" data-lang="en">English</a>
          <a href="#" data-lang="id">Indonesia</a>
        </div>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <!-- Hidden translations container (injected by server) -->
  <script id="i18n-translations" type="application/json">
    {{ contents | tojson }}
  </script>

  <!-- i18n client-side system -->
  <script src="/static/i18n.js"></script>

  <script nonce="{{ request.state.nonce }}">
    // Initialize i18n with translations from server
    I18n.translations = JSON.parse(document.getElementById('i18n-translations').textContent);
    I18n.init();
  </script>
</body>
</html>
